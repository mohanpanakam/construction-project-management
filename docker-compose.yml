services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB:       construction
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d construction"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── MinIO (S3-compatible local object storage) ─────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"   # S3 API  (use 9002 to avoid conflicts)
      - "9001:9001"   # Web console  →  http://localhost:9001
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── Bucket initializer (runs once, then exits) ─────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb local/construction-files --ignore-existing &&
        echo 'Bucket construction-files ready'
      "
    restart: "no"

  # ── OCR microservice (optional, opt-in via OCR_PROVIDER=PADDLE) ────────────
  # RapidOCR (rapidocr-onnxruntime) — same PP-OCR detection/recognition models
  # as PaddleOCR, but exported to ONNX and run via plain onnxruntime instead of
  # the full PaddlePaddle framework (whose official wheels are unreliable on
  # ARM64/Apple Silicon — see ocr-service/main.py for details). Much lighter
  # than native PaddlePaddle (~200-400MB RAM), so this is realistically usable
  # even on the production t4g.micro EC2 instance, unlike the original plan.
  ocr-service:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    container_name: ocr-service
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ── Ktor Backend ────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: construction-backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PORT:         "8080"
      DB_URL:       "jdbc:postgresql://postgres:5432/construction"
      DB_USER:      "postgres"
      DB_PASSWORD:  "postgres"
      S3_ENDPOINT:  "http://minio:9000"
      PUBLIC_S3_URL: "http://192.168.1.2:9002"
      S3_BUCKET:    "construction-files"
      AWS_REGION:   "us-east-1"
      AWS_ACCESS_KEY_ID:     "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadmin"
      # Set to PADDLE to try PaddleOCR for image receipts instead of Tesseract
      # (requires the ocr-service container above to be running).
      OCR_PROVIDER: "NONE"
      PADDLE_OCR_URL: "http://ocr-service:8000"
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  minio-data:
